<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Ethan portfolio home reference</title>
  <desc id="desc">Reference design for a portfolio home page with hero, photo, buttons with icons, and about text.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2d33" />
      <stop offset="100%" stop-color="#1f2127" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f7fb" />
      <stop offset="100%" stop-color="#efeff6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1f1235" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)" />
  <g opacity="0.16" stroke="#bfc6d9" stroke-width="1">
    <line x1="0" y1="140" x2="1440" y2="140" />
    <line x1="0" y1="280" x2="1440" y2="280" />
    <line x1="0" y1="420" x2="1440" y2="420" />
    <line x1="0" y1="560" x2="1440" y2="560" />
    <line x1="0" y1="700" x2="1440" y2="700" />
    <line x1="0" y1="840" x2="1440" y2="840" />
    <line x1="200" y1="0" x2="200" y2="960" />
    <line x1="420" y1="0" x2="420" y2="960" />
    <line x1="640" y1="0" x2="640" y2="960" />
    <line x1="860" y1="0" x2="860" y2="960" />
    <line x1="1080" y1="0" x2="1080" y2="960" />
    <line x1="1300" y1="0" x2="1300" y2="960" />
  </g>
  <circle cx="1270" cy="140" r="180" fill="#8b5cf6" opacity="0.18" />
  <circle cx="130" cy="820" r="220" fill="#22d3ee" opacity="0.12" />
  <circle cx="1220" cy="780" r="120" fill="#f472b6" opacity="0.12" />

  <rect x="120" y="70" width="1200" height="820" rx="28" fill="url(#panel)" filter="url(#shadow)" />

  <text x="190" y="134" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#5b4e72">Home</text>
  <text x="270" y="134" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#5b4e72">Projects</text>
  <text x="375" y="134" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#5b4e72">Resume</text>
  <text x="470" y="134" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#5b4e72">Contact</text>
  <text x="1248" y="134" text-anchor="end" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#4f4663">ethanhogge952@gmail.com</text>

  <line x1="180" y1="160" x2="1260" y2="160" stroke="#ece8f6" stroke-width="2" />

  <text x="720" y="248" text-anchor="middle" font-size="68" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#181028">Ethan Hogge</text>

  <text x="720" y="298" text-anchor="middle" font-size="25" font-family="Segoe UI, Arial, sans-serif" fill="#4f4663">
    Full stack developer building production software from defense systems
  </text>
  <text x="720" y="332" text-anchor="middle" font-size="25" font-family="Segoe UI, Arial, sans-serif" fill="#4f4663">
    to modern Vue applications.
  </text>

  <circle cx="720" cy="470" r="120" fill="#f1e9ff" stroke="#d7c8ff" stroke-width="10" />
  <circle cx="720" cy="450" r="48" fill="#d8d4e3" />
  <path d="M650 550c18-45 52-68 70-68 18 0 52 23 70 68" fill="#d8d4e3" />

  <g transform="translate(335,640)">
    <rect x="0" y="0" width="170" height="52" rx="12" fill="#efe7ff" stroke="#c5b6ff" />
    <circle cx="26" cy="26" r="12" fill="#5a3cb8" />
    <text x="48" y="33" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#281b4b">Email</text>

    <rect x="190" y="0" width="170" height="52" rx="12" fill="#efe7ff" stroke="#c5b6ff" />
    <circle cx="216" cy="26" r="12" fill="#0a66c2" />
    <text x="238" y="33" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#281b4b">LinkedIn</text>

    <rect x="380" y="0" width="170" height="52" rx="12" fill="#efe7ff" stroke="#c5b6ff" />
    <circle cx="406" cy="26" r="12" fill="#111827" />
    <text x="428" y="33" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#281b4b">GitHub</text>

    <rect x="570" y="0" width="170" height="52" rx="12" fill="#efe7ff" stroke="#c5b6ff" />
    <circle cx="596" cy="26" r="12" fill="#7c3aed" />
    <text x="618" y="33" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#281b4b">Resume</text>
  </g>

  <rect x="290" y="760" width="860" height="104" rx="16" fill="#faf7ff" stroke="#e7dcff" />
  <text x="720" y="802" text-anchor="middle" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#403756">
    I am a full stack developer with three years of experience across defense systems,
  </text>
  <text x="720" y="832" text-anchor="middle" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#403756">
    solar industry applications, and Vue modernization, working toward software architect.
  </text>
